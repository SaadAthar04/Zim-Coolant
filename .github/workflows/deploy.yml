name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

concurrency:
  group: vps-deploy
  cancel-in-progress: true   # if you push twice quickly, only the latest deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          # Strip any stray whitespace/newlines that may have crept into the secrets
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ~/htdocs/zimchemicals.com

            # The database holds live customer orders and is no longer tracked
            # in git. Copy it aside before pulling: the pull that untracks it
            # would otherwise delete it from the working tree.
            #
            # SQLite runs in WAL mode here, so recently committed transactions
            # may still live in the -wal file rather than the .db. All three
            # files move together, or an order could be lost and the restored
            # .db could be left beside a stale WAL it does not match.
            DB=database/zim-coolant.db
            SAFE=~/zim-db-backups
            STAGE=/tmp/zim-db-stage
            mkdir -p "$SAFE"
            rm -rf "$STAGE" && mkdir -p "$STAGE"

            if [ -f "$DB" ]; then
              STAMP=$(date +%Y%m%d-%H%M%S)
              for ext in "" "-wal" "-shm"; do
                if [ -f "$DB$ext" ]; then cp -p "$DB$ext" "$STAGE/zim-coolant.db$ext"; fi
              done
              tar -czf "$SAFE/zim-coolant-$STAMP.tar.gz" -C "$STAGE" .
            fi

            # Mirror the repository rather than merging into it. A deploy target
            # accumulates local edits to tracked files -- package-lock.json gets
            # rewritten by a stray npm install, the tracked database was written
            # to on every order -- and `git pull` then aborts rather than
            # deploying. Everything that matters here is either in git or staged
            # above, and ignored files such as .env are left untouched.
            git fetch origin main
            git reset --hard origin/main

            # Put the live database back, replacing whatever the reset left, and
            # restore its WAL alongside so the set stays internally consistent.
            if [ -f "$STAGE/zim-coolant.db" ]; then
              mkdir -p database
              rm -f "$DB" "$DB-wal" "$DB-shm"
              for ext in "" "-wal" "-shm"; do
                if [ -f "$STAGE/zim-coolant.db$ext" ]; then cp -p "$STAGE/zim-coolant.db$ext" "$DB$ext"; fi
              done
            fi

            npm ci

            # Apply the catalogue from database/catalog.json. This is a no-op
            # once the six products exist, so a deploy never overwrites prices,
            # stock or copy the shop has edited in the admin panel. To push a
            # changed catalog.json to the live site, run this on the server
            # deliberately:  node scripts/migrate-catalog.js --force
            # It backs the database up first and never touches orders.
            node scripts/migrate-catalog.js

            npm run build
            pm2 restart zim-coolant --update-env

            # Keep the ten most recent database backups.
            ls -1t "$SAFE"/zim-coolant-*.tar.gz 2>/dev/null | tail -n +11 | xargs -r rm --
            rm -rf "$STAGE"
          REMOTE
